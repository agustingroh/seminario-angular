<table class="table table-striped table-hover align-middle">
  <thead class="table-dark">
  <tr>
    <th scope="col">Nombre</th>
    <th scope="col">Cantidad</th>
  </tr>
  </thead>
  <tbody>
    @for (beer of beers; track beer.id) {
      <tr>
        <td>{{beer.name}}</td>
        <td>{{beer.quantity}}</td>
      </tr>
    }
  </tbody>
</table>
